# escape timeout in neovim
set -sg escape-time 0

# Setting up colors
# https://gist.github.com/ziimir/e5599c003b1431500117126d7b095368
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB'

# Reload tmux config so we can pick up changes to this file without needing to restart tmux
bind r source-file ~/.tmux.conf \; display "Reloaded tmux configuration!"

# Use vi-style navigation in Copy mode (which is also scrollback mode)
setw -g mode-keys vi
bind v copy-mode # Войти в visual/copy mode
bind -T copy-mode-vi v send-keys -X begin-selection # Начать обычное выделение
bind -T copy-mode-vi V send-keys -X select-line # Выделить строки целиком
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel # Скопировать и выйти
bind -T copy-mode-vi Escape send-keys -X cancel # Escape отменяет выделение или выходит
set -s copy-command 'pbcopy' # Копирование в системный clipboard

# Setting up status line messages are displaing
set -g display-time 3000

# Navigate panes vim-style
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate windows
bind C-l select-window -t :+
bind C-h select-window -t :-

# New panes in same directory
bind '%' split-window -h -c '#{pane_current_path}'
# Создать панель снизу без смены фокуса, подготовить Stacking и только затем переключиться в неё.
bind '"' split-window -v -d -c '#{pane_current_path}' \; \
    set-option -w pane-border-status top \; \
    set-option -w @stacking_mode 1 \; \
    select-pane -t :.+

# Floating panes -- Открыть pane, позиционирование: (100% − размер) / 2
bind '*' new-pane -x 80% -y 70% -X 10% -Y 15%
# Prefix + Ctrl+J: вернуть floating-панель в Stacking и развернуть её
bind-key c-j if-shell -F '#{pane_floating_flag}' {
    # Найти обычную панель, которую можно разделить
    set-option -pF @dock_target '#{s/ .*//:#{P:#{?#{&&:#{==:#{pane_floating_flag},0},#{e|>=:#{pane_height},4}},#{pane_id} ,}}}'

    if-shell -F '#{@dock_target}' {
        # Вставить панель, включить Stacking и запустить его перерасчёт.
        # Команды намеренно объединены в одну последовательность.
        run-shell -C 'join-pane -s "#{pane_id}" -t "#{@dock_target}" -v -l 30% ; set-option -w -t "#{window_id}" @stacking_mode 1 ; run-shell -t "#{pane_id}" "~/.local/bin/tmux-stack-panes.sh"'
    } {
        display-message 'Нет обычной панели достаточной высоты для вставки'
    }

    set-option -pu @dock_target
}

# New windows in same directory
bind-key '<' new-window -b -c '#{pane_current_path}'
bind-key '>' new-window -a -c '#{pane_current_path}'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber on windows close
set-option -g renumber-windows on

# Close all panes but this
bind-key X kill-pane -a

# Pane title
set -g pane-border-status off
set -g pane-border-format '#{?pane_active,\
 #{?#{==:#{pane_title},#{host}},, #{pane_title} | }#{s|^#{E:HOME}|~|:pane_current_path} | #{pane_current_command} ,\
 #{?#{==:#{pane_title},#{host}},, #{pane_title} | }#{?#{==:#{pane_current_command},zsh},#{pane_current_command},#[bg=red]  #[default] #{pane_current_command} } \
}'
bind T command-prompt -p "Pane name:" "select-pane -T '%%'"
set -g pane-active-border-style 'fg=yellow'
set -g pane-border-style 'fg=white'
set -g pane-border-lines heavy

# Stacking panes
bind S if-shell -F '#{==:#{@stacking_mode},1}' {
    set-option -w @stacking_mode 0
    select-layout even-vertical
} {
    if-shell -F '#{>:#{window_panes},1}' {
        set-option -w @stacking_mode 1
        run-shell '~/.local/bin/tmux-stack-panes.sh'
    }
}
# Пересчитывать Stacking при смене активной панели,
# в том числе после закрытия предыдущей
set-hook -g window-pane-changed {
    if-shell -F '#{==:#{@stacking_mode},1}' {
        # Не трогать раскладку при фокусе на float или включённом zoom
        if-shell -F '#{&&:#{==:#{pane_floating_flag},0},#{==:#{window_zoomed_flag},0}}' {
            run-shell '~/.local/bin/tmux-stack-panes.sh'
        }
    }
}
set-hook -g window-layout-changed { # хук на изменение геометрии window
    if-shell -F '#{window_zoomed_flag}' {
        # zoom on
        set-option -w pane-border-status off # выключаем title у pane
    } {
        # zoom off
        if-shell -F '#{==:#{window_panes},1}' {
            set-option -w @stacking_mode 0 # выключаем stacking mode
            set-option -w pane-border-status off # выключаем title у pane
        } {
            set-option -w pane-border-status top # включаем title у pane
        }
    }
}

# Resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows highlighting in status line
set -s theme terminal

setw -g window-status-format '#I#{?window_zoomed_flag,:,#{?#{==:#{@stacking_mode},1},:,}}:#{b:pane_current_path}'
setw -g window-status-style fg=black,bg=green

setw -g window-status-last-style fg=black,bg=green
setw -g window-status-bell-style fg=black,bg=green
setw -g window-status-activity-style fg=black,bg=green

setw -g window-status-current-style fg=green,bg=terminal
set -g window-status-current-format '#I#{?window_zoomed_flag,:#[fg=yellow],#{?#{==:#{@stacking_mode},1},:#[fg=yellow],}#[default]}#[default]:#{b:pane_current_path}'

# Monitor windows for activity
setw -g monitor-activity on
set -g visual-activity on

# Status bar
set -g status-right '#(test -n "$SSH_CONNECTION" && printf "#[bg=red] [#h] " || printf "")'
set -g status-position top
set -g status-left-length 100
set -g status-interval 15

# Full screen
bind F resize-pane -Z

# Sessions in popup
bind s display-popup \
    -E \
    -w 80% \
    -h 80% \
    -T " Current: #S " \
    "tmux list-sessions | sed -E 's/:.*$//' | sed \"s/^$(tmux display-message -p '#S')$/\> &/\" |  fzf --reverse | sed 's/^>* //' | xargs tmux switch-client -t"

# Windows in popup
bind w display-popup \
    -E \
    -w 80% \
    -h 80% \
    -T " Current window: #W " \
    "tmux list-windows -F '#{window_index}: #{window_name} — #{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}}' | sed \"s/^$(tmux display-message -p '#I'):/\> &/\" | fzf --reverse | sed -E 's/^> *//; s/:.*$//' | xargs -I {} tmux select-window -t '{}'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
